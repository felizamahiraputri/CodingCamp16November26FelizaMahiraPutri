<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <div class="topbar">
      <button class="secondary" id="themeButton" type="button">🌙 Dark Mode</button>
    </div>

    <section class="card hero">
      <div id="clock">00:00:00</div>
      <div id="date">Memuat tanggal...</div>
      <h1 id="greeting">Good Evening!</h1>
      <div class="name-row">
        <input class="small-input" id="nameInput" type="text" placeholder="Masukkan nama">
        <button id="saveName" type="button">Simpan Nama</button>
      </div>
    </section>

    <section class="layout">
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timerDisplay">25:00</div>
        <div class="button-row">
          <button id="startTimer" type="button">Start</button>
          <button class="secondary" id="stopTimer" type="button">Stop</button>
          <button class="secondary" id="resetTimer" type="button">Reset</button>
        </div>
        <div class="settings">
          <label for="focusMinutes">Durasi (menit):</label>
          <input id="focusMinutes" type="number" min="1" max="180" value="25">
          <button class="secondary" id="setDuration" type="button">Atur</button>
        </div>
      </section>

      <section class="card">
        <h2>Tasks</h2>
        <form class="task-form" id="taskForm">
          <input id="taskInput" type="text" placeholder="Add a new task..." autocomplete="off" required>
          <button type="submit">Add</button>
        </form>
        <ul class="task-list" id="taskList"></ul>
      </section>

      <section class="card quick-card">
        <h2>Quick Links</h2>
        <form class="link-form" id="linkForm">
          <input id="linkName" type="text" placeholder="Link name" required>
          <input id="linkUrl" type="url" placeholder="URL (https://...)" required>
          <button type="submit">Add Link</button>
        </form>
        <div class="quick-links" id="quickLinks"></div>
      </section>
    </section>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
